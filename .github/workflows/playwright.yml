name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'   # Run at 12:00 AM UTC every day
    - cron: '0 12 * * *'  # Run at 12:00 PM UTC every day
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
      test_type:
        description: 'Type of test to run'
        required: true
        default: 'ui'
        type: choice
        options:
          - ui
          - visual
          - api
          - all
          - update_screenshots

jobs:
  playwright-tests:
    name: "Playwright Tests - ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.browser || github.event_name == 'schedule' && 'scheduled API tests' || 'based on event' }}"
    runs-on: ubuntu-latest
    
    # Add environment variables using repository secrets
    env:
      SAUCEUIUSER: ${{ secrets.SAUCEUIUSER }}
      SAUCEUIPASSWORD: ${{ secrets.SAUCEUIPASSWORD }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install project dependencies
        run: npm ci
        
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      # ---------- SCHEDULED TESTS ----------
      
      # Run API tests on schedule (12 AM and 12 PM UTC daily)
      - name: Run scheduled API tests (twice daily)
        if: github.event_name == 'schedule'
        run: npx playwright test --config=api.config.ts
      
      # ---------- PUSH EVENT TESTS ----------
      
      # Run UI tests on push events
      - name: Run UI tests on push (Chromium)
        if: github.event_name == 'push'
        run: npx playwright test --config=playwright.config.ts --project=chromium
      
      # Run Visual tests on push events
      - name: Run Visual tests on push (Chromium)
        if: github.event_name == 'push'
        run: npx playwright test --config=visual.config.ts --project=chromium
      
      # Run API tests on push events
      - name: Run API tests on push
        if: github.event_name == 'push'
        run: npx playwright test --config=api.config.ts
      
      # ---------- PULL REQUEST TESTS ----------
      
      # Run UI tests on PR
      - name: Run UI tests on PR
        if: github.event_name == 'pull_request'
        run: npx playwright test --config=playwright.config.ts --project=chromium
      
      # Run Visual tests on PR
      - name: Run Visual tests on PR
        if: github.event_name == 'pull_request'
        run: npx playwright test --config=visual.config.ts --project=chromium
      
      # Run API tests on PR
      - name: Run API tests on PR
        if: github.event_name == 'pull_request'
        run: npx playwright test --config=api.config.ts
      
      # ---------- MANUAL DISPATCH TESTS ----------
      
      # Run UI tests based on workflow_dispatch input
      - name: Run UI tests on selected browser
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.test_type == 'ui' || github.event.inputs.test_type == 'all') && github.event.inputs.browser != 'all'
        run: npx playwright test --config=playwright.config.ts --project=${{ github.event.inputs.browser }}
      
      # Run UI tests on all browsers
      - name: Run UI tests on all browsers
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.test_type == 'ui' || github.event.inputs.test_type == 'all') && github.event.inputs.browser == 'all'
        run: npx playwright test --config=playwright.config.ts
      
      # Run Visual tests based on workflow_dispatch input
      - name: Run Visual tests on selected browser
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.test_type == 'visual' || github.event.inputs.test_type == 'all') && github.event.inputs.browser != 'all'
        run: npx playwright test --config=visual.config.ts --project=${{ github.event.inputs.browser }}
      
      # Run Visual tests on all browsers
      - name: Run Visual tests on all browsers
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.test_type == 'visual' || github.event.inputs.test_type == 'all') && github.event.inputs.browser == 'all'
        run: npx playwright test --config=visual.config.ts
      
      # Run API tests based on workflow_dispatch input
      - name: Run API tests
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.test_type == 'api' || github.event.inputs.test_type == 'all')
        run: npx playwright test --config=api.config.ts
      
      # Update screenshots (manual dispatch only)
      - name: Update Visual test screenshots
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_type == 'update_screenshots'
        run: npx playwright test --config=visual.config.ts --update-snapshots ${{ github.event.inputs.browser != 'all' && format('--project={0}', github.event.inputs.browser) || '' }}
      
      # ---------- ARTIFACTS ----------
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30