name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
      test_type:
        description: 'Type of test to run'
        required: true
        default: 'ui'
        type: choice
        options:
          - ui
          - visual
          - update_screenshots

jobs:
  playwright-tests:
    name: "Playwright Tests - ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.browser || 'based on event' }}"
    runs-on: ubuntu-latest
    
    # Add environment variables using repository secrets
    env:
      SAUCEUIUSER: ${{ secrets.SAUCEUIUSER }}
      SAUCEUIPASSWORD: ${{ secrets.SAUCEUIPASSWORD }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright browsers
        run: npx playwright install
      
      # Run UI tests on push events
      - name: Run UI tests on push (Chromium)
        if: github.event_name == 'push'
        run: npx playwright test --config=playwright.config.ts --project=chromium
      
      # Run Visual tests on push events
      - name: Run Visual tests on push (Chromium)
        if: github.event_name == 'push'
        run: npx playwright test --config=visual.config.ts --project=chromium
      
      # Run UI tests based on workflow_dispatch input
      - name: Run UI tests on selected browser
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_type == 'ui' && github.event.inputs.browser != 'all'
        run: npx playwright test --config=playwright.config.ts --project=${{ github.event.inputs.browser }}
      
      # Run UI tests on all browsers
      - name: Run UI tests on all browsers
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_type == 'ui' && github.event.inputs.browser == 'all'
        run: npx playwright test --config=playwright.config.ts
      
      # Run Visual tests based on workflow_dispatch input
      - name: Run Visual tests on selected browser
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_type == 'visual' && github.event.inputs.browser != 'all'
        run: npx playwright test --config=visual.config.ts --project=${{ github.event.inputs.browser }}
      
      # Run Visual tests on all browsers
      - name: Run Visual tests on all browsers
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_type == 'visual' && github.event.inputs.browser == 'all'
        run: npx playwright test --config=visual.config.ts
      
      # Update screenshots (manual dispatch only)
      - name: Update Visual test screenshots
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_type == 'update_screenshots'
        run: npx playwright test --config=visual.config.ts --update-snapshots ${{ github.event.inputs.browser != 'all' && format('--project={0}', github.event.inputs.browser) || '' }}
      
      # Run UI tests on PR
      - name: Run UI tests on PR
        if: github.event_name == 'pull_request'
        run: npx playwright test --config=playwright.config.ts --project=chromium

      # Run Visual tests on PR
      - name: Run Visual tests on PR
        if: github.event_name == 'pull_request'
        run: npx playwright test --config=visual.config.ts --project=chromium
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30